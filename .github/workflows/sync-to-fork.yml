name: Sync to personal fork

on:
  push:
    branches:
      - dev
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      PERSONAL_FORK_TOKEN: ${{ secrets.PERSONAL_FORK_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Push to personal fork
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git config --unset-all http.https://github.com/.extraheader || true

          git remote add fork https://chldntjr1321:${PERSONAL_FORK_TOKEN}@github.com/chldntjr1321/The-Julge.git

          echo ">>> fork remote:"
          git remote get-url fork

          BRANCH="${{ github.ref_name }}"
          git push --force fork HEAD:$BRANCH
