name: Sync to personal fork

on:
  push:
    branches:
      - dev
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Push to personal fork
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git remote add fork https://chldntjr1321:${{ secrets.PERSONAL_FORK_TOKEN }}@github.com/chldntjr1321/The-Julge.git

          # 현재 push 이벤트가 발생한 브랜치 이름(dev 또는 main)
          BRANCH="${{ github.ref_name }}"

          # 동일한 브랜치명으로 개인 레포에 push
          git push fork HEAD:$BRANCH
